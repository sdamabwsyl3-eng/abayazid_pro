name: Build & Release Abayazeed Link Manager APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-apk:
    name: بناء ملف APK السحابي لميكروتك
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: استنساخ المستودع
        uses: actions/checkout@v4

      - name: إعداد بيئة Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: إعداد Flutter 3.19.0
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'
          cache: true

      - name: تجهيز المشروع وإنشاء ملفات الأندرويد
        run: |
          flutter create --no-pub --org com.abayazeed --project-name abayazeedlinkmanager app_temp
          cp -r lib/* app_temp/lib/

      - name: تعديل اسم التطبيق في AndroidManifest
        run: |
          sed -i 's/android:label=".*"/android:label="أبا يزيد لنك منجر"/' app_temp/android/app/src/main/AndroidManifest.xml
          sed -i 's/<application/<application android:usesCleartextTraffic="true"/' app_temp/android/app/src/main/AndroidManifest.xml

      - name: تثبيت الحزم والتبعيات
        run: |
          cd app_temp
          flutter pub add google_fonts
          flutter pub get

      - name: بناء ملف APK النهائي
        run: |
          cd app_temp
          flutter build apk --release --no-tree-shake-icons

      - name: تجهيز وتسمية ملف APK للتحميل
        run: |
          mkdir -p output_release
          cp app_temp/build/app/outputs/flutter-apk/app-release.apk output_release/abayazeed_link_manager.apk

      - name: رفع ملف APK كملف مرفق
        uses: actions/upload-artifact@v4
        with:
          name: abayazeed-link-manager-apk
          path: output_release/abayazeed_link_manager.apk
          retention-days: 30
